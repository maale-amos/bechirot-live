name: update news and polls
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
      - name: commit if changed
        run: |
          git config user.name "bechirot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json polls.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: news and polls"
          git pull --rebase -q || true
          git push
